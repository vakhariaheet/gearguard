assignRequest:
  handler: src/modules/requests/handlers/assignRequest.handler
  events:
    - httpApi:
        path: /api/requests/{id}/assign
        method: post
        authorizer:
          name: clerkJwtAuthorizer
  environment:
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
  timeout: 30
  memorySize: 256
