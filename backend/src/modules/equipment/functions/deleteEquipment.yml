deleteEquipment:
  handler: src/modules/equipment/handlers/deleteEquipment.handler
  events:
    - httpApi:
        path: /api/equipment/{id}
        method: DELETE
        authorizer:
          name: clerkJwtAuthorizer
        swaggerTags:
          - Equipment
        summary: DELETE /api/equipment/{id}
        description: Delete equipment by ID
        methodResponses:
          - statusCode: 200
            responseBody:
              description: Equipment deleted successfully
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
          - statusCode: 401
            responseBody:
              description: Unauthorized - Invalid or missing token
          - statusCode: 403
            responseBody:
              description: Forbidden - Insufficient permissions
          - statusCode: 404
            responseBody:
              description: Equipment not found
